[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setter_backend"
version = "0.0.1"
description = "Backend for Rambla Vertical route track "
requires-python = ">=3.12"
authors = [
  { name = "Mattia Senni" }
]

dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.0",
    "fastapi==0.127.0",
    "idna==3.11",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "starlette==0.50.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.40.0",
    "sqlalchemy==2.0.45",
    "python-dotenv==1.2.1",
    "psycopg==3.3.2",
    "email-validator==2.3.0"
]



[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
start_backend = "setter_backend.main:app"


